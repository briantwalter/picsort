[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picsort"
version = "0.1.0"
description = "Resumable image deduplication and organization CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "ImageHash>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
heic = ["pillow-heif>=0.16"]
raw = ["rawpy>=0.19"]
video = ["av>=12.0"]

[project.scripts]
picsort = "picsort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
